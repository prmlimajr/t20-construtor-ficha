<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Prévia — subir de nível</title>
	<!-- Prévia da animação fora do Foundry. Sirva a pasta do módulo por HTTP (módulos ES não carregam em file://):
	     python3 -m http.server 8000   (dentro de t20-construtor-ficha) → http://localhost:8000/ferramentas/previa-animacao.html -->
	<link rel="stylesheet" href="../styles/main.css">
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2b2b url("../assets/logo.webp") center / 240px no-repeat; font-family: sans-serif; }
		button { font-size: 18px; padding: 10px 18px; cursor: pointer; }
	</style>
</head>
<body>
	<button type="button" id="testar">Subir de nível</button>
	<script type="module">
		import { animarSubidaDeNivel } from "../scripts/animacao-nivel.js";
		let nivel = 4;
		document.getElementById("testar").addEventListener("click", () => {
			nivel = nivel >= 20 ? 2 : nivel + 1;
			animarSubidaDeNivel({ nivel, detalhe: `Kaz · Guerreiro ${nivel} · +7 PV · +3 PM` });
		});
	</script>
</body>
</html>
