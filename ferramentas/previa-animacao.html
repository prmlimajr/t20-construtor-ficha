<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Prévia — subir de nível</title>
	<!-- Prévia da animação fora do Foundry. Sirva a pasta do módulo por HTTP (módulos ES não carregam em file://):
	     python3 -m http.server 8000   (dentro de t20-construtor-ficha) → http://localhost:8000/ferramentas/previa-animacao.html -->
	<link rel="stylesheet" href="../styles/main.css">
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 12px; background: #2b2b2b; font-family: sans-serif; }
		/* simula a janela do assistente (fundo do construtor) */
		.janela { position: relative; width: min(1040px, 94vw); height: min(560px, 70vh); border-radius: 6px; overflow: hidden;
			background: #b52d35; box-shadow: 0 8px 30px #000; display: grid; place-items: center; color: #fff; }
		button { font-size: 16px; padding: 8px 16px; cursor: pointer; }
	</style>
</head>
<body>
	<div class="janela t20-construtor" id="janela"><p>Janela do assistente</p></div>
	<button type="button" id="testar">Subir de nível</button>
	<script type="module">
		import { animarSubidaDeNivel } from "../scripts/animacao-nivel.js";
		let nivel = 4;
		document.getElementById("testar").addEventListener("click", () => {
			nivel = nivel >= 20 ? 2 : nivel + 1;
			animarSubidaDeNivel({ container: document.getElementById("janela"), nivel, detalhe: `Guerreiro ${nivel} · +7 PV · +3 PM` });
		});
	</script>
</body>
</html>
